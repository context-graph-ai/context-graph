[package]
name = "context-graph-cli"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Context Graph command-line interface"
edition = "2024"

[lib]
name = "cg_cli"
path = "src/lib.rs"

[[bin]]
name = "cg"
path = "src/main.rs"

[features]
# The `cg status` fault-injection door, off in every shipped build. It is turned on ONLY by this
# package's dev-dependency on itself below, so `cargo test` compiles it and `cargo build` — debug
# or release — does not: a build profile is not a test boundary, and a developer's ordinary debug
# binary must neither read nor contain the variable.
status-fault-injection = []

[dependencies]
cg-catalog = { path = "../cg-catalog" }
cg-connector-claude-code.workspace = true
cg-node-fs.workspace = true
cg-cli-conventions.workspace = true
# fabric-sync enables the SyncClient-consuming worker seam (fabric::run_worker_once) so `cg worker`
# can run this node as a remote understanding executor. It is a cg-cli-only activation — the library's
# own default build stays fabric-sync-off (tokio-free embeddable core).
context-graph = { path = "../context-graph", features = ["fabric-sync"] }
contextdb-core.workspace = true
contextdb-engine.workspace = true
contextdb-server = { git = "https://github.com/context-graph-ai/contextdb", rev = "46e99e2eefa20853b109ae17a60627d4d7202f5d", features = ["iroh"] }
fs4.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
# This package on itself, so the fault-injection door above is compiled for TEST builds and only
# those. Cargo resolves dev-dependency features for `cargo test` and leaves them out of
# `cargo build`/`cargo install`, which is the boundary a profile check does not give.
context-graph-cli = { path = ".", features = ["status-fault-injection"] }
# The store-contention harness (tests/support/store_contention.rs) parks a real direct reader
# inside contextdb's shipped read-image hydration checkpoint, which is the only honest way to
# produce reader contention: it exists only WHILE a committed image is loading. That checkpoint is
# compiled behind contextdb-engine's `test-seams` feature. This is a test-only activation — the
# `cg` binary's own dependency edge on contextdb-engine is unchanged.
contextdb-engine = { workspace = true, features = ["test-seams"] }
contextdb-server = { git = "https://github.com/context-graph-ai/contextdb", rev = "46e99e2eefa20853b109ae17a60627d4d7202f5d", features = ["iroh", "test-seams"] }
libc = "0.2"
tempfile.workspace = true
