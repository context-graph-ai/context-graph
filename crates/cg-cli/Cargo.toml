[package]
name = "context-graph-cli"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Context Graph command-line interface"
edition = "2024"

[lib]
name = "cg_cli"
path = "src/lib.rs"

[[bin]]
name = "cg"
path = "src/main.rs"

[dependencies]
cg-catalog = { path = "../cg-catalog" }
cg-cli-conventions.workspace = true
context-graph = { path = "../context-graph" }
contextdb-core.workspace = true
contextdb-engine.workspace = true
contextdb-server = { path = "../../../contextdb/crates/contextdb-server", features = ["nats"] }
fs4.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
testcontainers = "0.27"
