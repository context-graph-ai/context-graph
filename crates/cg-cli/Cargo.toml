[package]
name = "context-graph-cli"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Context Graph command-line interface"
edition = "2024"

[lib]
name = "cg_cli"
path = "src/lib.rs"

[[bin]]
name = "cg"
path = "src/main.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
cg-catalog = { path = "../cg-catalog" }
context-graph = { path = "../context-graph" }
tempfile.workspace = true
