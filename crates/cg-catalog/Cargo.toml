[package]
name = "cg-catalog"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Kind-agnostic model catalog and cache lifecycle library"
edition = "2024"

[features]
default = []
embeddinggemma-test-support = []
# NVIDIA acceleration for the bundled local understanding engine; off by default.
cuda = ["cg-local-llm/cuda"]

[lib]
name = "cg_catalog"
path = "src/lib.rs"

[dependencies]
candle-embeddinggemma.workspace = true
candle-core.workspace = true
cg-cli-conventions.workspace = true
cg-local-llm = { path = "../cg-local-llm" }
context-graph = { path = "../context-graph" }
contextdb-core.workspace = true
contextdb-engine.workspace = true
chrono.workspace = true
fs4.workspace = true
indicatif.workspace = true
safetensors.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
tracing.workspace = true
ureq.workspace = true
uuid = { workspace = true, features = ["serde", "v4", "v7"] }
which.workspace = true

[dev-dependencies]
candle-embeddinggemma.workspace = true
chrono.workspace = true
contextdb-core.workspace = true
contextdb-engine.workspace = true
safetensors.workspace = true
serde_yaml_ng.workspace = true
tempfile.workspace = true
tiny_http.workspace = true
tokenizers.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
which.workspace = true
