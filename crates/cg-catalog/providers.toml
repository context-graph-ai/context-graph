# Local in-process understanding provider (style: local-gguf).
#
# The bundled understanding model (catalog id `gemma4-e2b-it-q4`) is NOT an HTTP or CLI provider:
# it is a local catalog artifact (a single-file GGUF), dispatched IN-PROCESS by `cg-local-llm`
# exactly like the bundled embedders are dispatched by candle — no binary, no endpoint, no server.
# Its structured-output style is `local-gguf`: the capture schema is compiled to a llama.cpp GBNF
# grammar and attached to the sampler, so the reply is structurally forced to shape and reported as
# `Native`; on a schema that cannot be represented as a grammar it degrades to the prompt-block
# floor and reports `Floor` (achieved-not-configured, finalized from the observed reply). Because
# selection is by the local GGUF artifact rather than a provider connection, there is no
# `[providers.local]` HTTP/CLI row here — the dispatch lives on the catalog local-artifact path
# (`understand_local_gguf`), which is the same route the embedders take.

[providers.claude]
binary = "claude"
structured_output = "none"
prompt_delivery = "stdin"
completion_args = [
  "-p",
  "--output-format=json",
  "--strict-mcp-config",
  "--mcp-config={\"mcpServers\":{}}",
  "--tools=\"\"",
]
env_remove = [
  "ANTHROPIC_AUTH_TOKEN",
  "ANTHROPIC_API_KEY",
  "CLAUDE_CODE_USE_BEDROCK",
  "CLAUDE_CODE_USE_VERTEX",
  "CLAUDE_CODE_USE_FOUNDRY",
  "ANTHROPIC_BASE_URL",
]
env_preserve = ["CLAUDE_CODE_OAUTH_TOKEN"]
reply_framing = "json"
reply_path = "/result"
timeout_ms = 15000
consent_required = true
required_help_flags = ["--output-format", "--mcp-config", "--strict-mcp-config", "--tools"]
last_verified = "claude 2.1.162"
auth_probe_args = ["auth", "status"]
auth_account_paths = ["/account", "/email", "/user/email", "/login", "/username"]

[providers.claude.success]
path = "/is_error"
equals = false

[providers.claude.auth_success]
any_of = [
  { path = "/loggedIn", equals = true },
  { path = "/ok", equals = true },
  { path = "/authenticated", equals = true },
  { path = "/status", equals = "logged_in" },
]

[providers.claude.auth_required]
all_of = [
  { path = "/apiProvider", equals = "firstParty" },
]

[providers.codex]
binary = "codex"
structured_output = "none"
prompt_delivery = "stdin"
completion_args = [
  "exec",
  "--output-last-message={output_file}",
  "-C",
  "{cwd}",
  "--skip-git-repo-check",
  "--ignore-user-config",
  "--ephemeral",
  "-c",
  "model_reasoning_effort=\"low\"",
]
env_remove = ["OPENAI_API_KEY", "CODEX_API_KEY"]
env_preserve = []
reply_framing = "file"
reply_path = "output_file"
timeout_ms = 30000
consent_required = true
required_help_flags = ["--output-last-message"]
last_verified = "codex 0.136.0"

[providers.openai]
transport = "http"
auth_scheme = "bearer"
base_url = "https://api.openai.com/v1"
default_model = "gpt-4.1-mini"
dialect = "openai-chat-completions"
reply_path = "/choices/0/message/content"
structured_output = "response_format_schema"
timeout_ms = 10000
consent_required = true

