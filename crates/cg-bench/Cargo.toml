[package]
name = "cg-bench"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

# Correctness bench (NOT a shipped product surface): grades understanding output against the
# owner-approved gold set under the pre-registered scoring method frozen in
# docs/cg-correctness-criteria.md (criteria commit 99d99ee). The scoring thresholds in this crate
# are that registration; changing them is a product-frame change, not engineering.

[dependencies]
context-graph = { path = "../context-graph" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
