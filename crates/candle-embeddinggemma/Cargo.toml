[package]
name = "candle-embeddinggemma"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "EmbeddingGemma text embedder for context-graph"
edition = "2024"

[lib]
name = "candle_embeddinggemma"
path = "src/lib.rs"

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
context-graph = { path = "../context-graph" }
safetensors.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokenizers.workspace = true

[dev-dependencies]
chrono = { workspace = true, features = ["serde"] }
contextdb-engine = { workspace = true, features = ["test-seams"] }
tempfile.workspace = true
uuid = { workspace = true, features = ["serde", "v4", "v7"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(context_graph_internal_test_support)'] }
