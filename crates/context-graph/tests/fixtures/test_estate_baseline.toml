[gate_wall_seconds_policy]
# A test binary's ceiling is `recorded seconds * tolerance_factor + slack_seconds`. Both terms are
# needed because a fresh measurement drifts from a frozen one in two unrelated ways, and neither
# term can absorb the other's.
#
# The multiplicative term covers drift that scales with the binary: the same tests run against a
# busier machine, more of them waiting on the same disk and the same cores. The additive term
# covers the part that does NOT scale — one process spawn per test under nextest, and the first
# read of a file that a later run finds in the page cache. On a binary whose whole run is a few
# spawns that fixed cost is many times the binary's own seconds, so a purely relative ceiling
# reports the machine's scheduling as a runtime regression.
#
# The pool a measurement is taken in is part of the measurement. A baseline captured from a
# full-workspace gate and a measurement taken from a smaller selection are two different amounts of
# contention over the same cores and the same disk, so they are not directly comparable numbers.
# The gate cannot re-run the baseline's pool, so the allowance above is what makes the comparison
# survive that difference. This is the reason the additive term exists at all.
#
# The additive allowance applies to every binary, including those with a relative ceiling
# above the fixed process-start and filesystem-read cost.
#
# Both values only ever LOWER. Raising either buys room for a regression instead of describing the
# machine, and takes the same documented exception any other ratchet raise does.
tolerance_factor = 2.991
slack_seconds = 0.235

[gate_wall_seconds]
# test binary (nextest testsuite name, crate::binary, or a finer classname the junit itself
# reports) -> wall seconds captured from one full gate's own junit on the reference machine,
# 2026-09-05, TMPDIR on that machine's local disk-backed filesystem. The live
# arm (gate_wall_seconds_never_exceed_the_frozen_baseline, run with CG_GATE_JUNIT set) fails a
# binary whose fresh wall seconds exceed this value times [gate_wall_seconds_policy]
# tolerance_factor plus its slack_seconds. A binary the gate ran that has no row here is reported
# too: an unratcheted binary has no ceiling at all, so a row is added in the same change that adds
# the binary and is removed only in the change that removes the binary. Each value is the sum of
# that binary's per-test seconds in the gate's own junit. This table only ever lowers as measured
# performance improves — the ordinary move on a regression is to fix it, not raise the ceiling.
# The twenty event-history binaries' rows came from one full gate-profile junit on 2026-09-13,
# on a 4-core host started at load 1.64 with no other Cargo process, TMPDIR on local ext4.
