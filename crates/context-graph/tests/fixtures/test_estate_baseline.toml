# Test-estate discipline audit baseline (see AGENTS.md "Fast test command and gate").
#
# Three ratchet arms `test_estate_audit.rs` enforces, and the two counted arms move in different
# directions: `[sleep_and_clock_sites]` entries only ever lower — raising one back up requires the
# same documented exception any other ratchet raise does; `[default_tier_test_count]` entries
# track the estate exactly and move with it in the same change that changes the estate — a change
# that adds tests raises the entry, a change that deliberately removes tests lowers it and says
# why.

[sleep_and_clock_sites]
# file (repo-relative) -> the frozen maximum count of std::thread::sleep(/tokio::time::sleep(/
# SystemTime::now(/Instant::now(/Utc::now( call sites in that file, outside the seamed
# contextdb_core::Wallclock::now(). A new site, in a listed file or a new one, fails the audit;
# removing a site lowers the count in the same change.
