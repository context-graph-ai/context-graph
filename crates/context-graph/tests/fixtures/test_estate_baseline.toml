# crate (Cargo.toml package name) -> the exact number of #[test]/#[tokio::test] functions in the
# default tier: excludes anything gated behind #[cfg(context_graph_internal_test_support)] and
# anything carrying #[ignore]. This entry moves with the estate in the same change: a change that
# adds tests raises the entry to match in the same change, so the ratchet protects the tests it
# just added; a change that deliberately removes tests lowers the entry in the same change and
# says why. The audit fails if a crate's live count differs from its baseline in either direction
# without that same-change update. Every crate the tree ships carries a row: a crate with no
# default-tier tests declares 0 rather than omitting the row, because a crate with no row is a
# crate outside the ratchet, and the audit reports it rather than exempting it.
