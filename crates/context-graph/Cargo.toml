[package]
name = "context-graph"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Agentic memory graph — Intention-centric ontology, contextdb-backed"
edition = "2024"

[lib]
name = "context_graph"
path = "src/lib.rs"

[dependencies]
chrono = { workspace = true, features = ["serde"] }
contextdb-core.workspace = true
contextdb-engine.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid = { workspace = true, features = ["serde", "v4", "v7"] }

[dev-dependencies]
tempfile = "3.23.0"
trybuild = "1.0.112"
