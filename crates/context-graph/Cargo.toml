[package]
name = "context-graph"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Agentic memory graph — Intention-centric ontology, contextdb-backed"
edition = "2024"

[lib]
name = "context_graph"
path = "src/lib.rs"

[features]
default = ["nomic-embedder"]
nomic-embedder = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:safetensors",
    "dep:tokenizers",
    "dep:ureq",
]

[dependencies]
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
contextdb-core.workspace = true
contextdb-engine.workspace = true
pollster.workspace = true
safetensors = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
strum.workspace = true
toml.workspace = true
tokenizers = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
uuid = { workspace = true, features = ["serde", "v4", "v7"] }

[dev-dependencies]
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
cg-catalog = { path = "../cg-catalog", features = ["embeddinggemma-test-support"] }
contextdb-server = { path = "../../../contextdb/crates/contextdb-server", features = ["nats"] }
contextdb-engine = { workspace = true, features = ["test-seams"] }
contextdb-tx.workspace = true
contextdb-vector = { workspace = true, features = ["test-seams"] }
criterion.workspace = true
safetensors.workspace = true
sha2.workspace = true
serde_yaml_ng.workspace = true
tempfile.workspace = true
testcontainers = "0.27"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokenizers.workspace = true
trybuild.workspace = true

[[bench]]
name = "cg_crud"
harness = false
path = "../../benches/cg_crud.rs"

[[bench]]
name = "cg_graph"
harness = false
path = "../../benches/cg_graph.rs"

[[bench]]
name = "cg_impact_analysis"
harness = false
path = "../../benches/cg_impact_analysis.rs"

[[bench]]
name = "cg_embedding_spaces"
harness = false
path = "benches/cg_embedding_spaces.rs"
