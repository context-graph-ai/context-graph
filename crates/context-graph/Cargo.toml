[package]
name = "context-graph"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Agentic memory graph — Intention-centric ontology, contextdb-backed"
edition = "2024"

[lib]
name = "context_graph"
path = "src/lib.rs"

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
chrono = { workspace = true, features = ["serde"] }
contextdb-core.workspace = true
contextdb-engine.workspace = true
safetensors.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
strum.workspace = true
tokenizers.workspace = true
uuid = { workspace = true, features = ["serde", "v4", "v7"] }

[features]
embeddinggemma-runtime = []

[dev-dependencies]
candle-embeddinggemma = { path = "../candle-embeddinggemma" }
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
contextdb-engine = { workspace = true, features = ["test-seams"] }
contextdb-tx.workspace = true
contextdb-vector = { workspace = true, features = ["test-seams"] }
criterion.workspace = true
safetensors.workspace = true
sha2.workspace = true
serde_yml.workspace = true
tempfile.workspace = true
tokenizers.workspace = true
trybuild.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(context_graph_internal_test_support)', 'cfg(trybuild)'] }

[[bench]]
name = "cg_crud"
harness = false
path = "../../benches/cg_crud.rs"

[[bench]]
name = "cg_graph"
harness = false
path = "../../benches/cg_graph.rs"

[[bench]]
name = "cg_impact_analysis"
harness = false
path = "../../benches/cg_impact_analysis.rs"

[[bench]]
name = "cg_embedding_spaces"
harness = false
path = "benches/cg_embedding_spaces.rs"
