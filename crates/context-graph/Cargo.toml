[package]
name = "context-graph"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Agentic memory graph — Intention-centric ontology, contextdb-backed"
edition = "2024"

[lib]
name = "context_graph"
path = "src/lib.rs"

[dependencies]
chrono = { workspace = true, features = ["serde"] }
contextdb-core.workspace = true
contextdb-engine.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid = { workspace = true, features = ["serde", "v4", "v7"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3.23.0"
trybuild = "1.0.112"

[[bench]]
name = "cg_crud"
harness = false
path = "../../benches/cg_crud.rs"

[[bench]]
name = "cg_graph"
harness = false
path = "../../benches/cg_graph.rs"
