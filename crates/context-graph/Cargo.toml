[package]
name = "context-graph"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Agentic memory graph — Intention-centric ontology, contextdb-backed"
edition = "2024"

[lib]
name = "context_graph"
path = "src/lib.rs"

[features]
default = ["nomic-embedder"]
# Private controls: activated by this crate's dev dependency, never by release defaults.
test-support = []
nomic-embedder = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:safetensors",
    "dep:tokenizers",
    "dep:ureq",
]
# The distributed-fabric worker seam. OFF by default so the embeddable core library stays
# tokio-free and native-dep-free (vigil/WASM embed it, and the purity guards check the
# default `--edges normal,build` tree). cg-cli and the fabric integration tests enable it;
# everything the fabric offloads (submission, apply, movement, retention, status) is always
# compiled — only the SyncClient-consuming worker loop lives behind this flag.
fabric-sync = ["dep:contextdb-server"]

[dependencies]
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
cg-node-fs.workspace = true
chrono = { workspace = true, features = ["serde"] }
contextdb-core.workspace = true
contextdb-engine.workspace = true
contextdb-parser.workspace = true
contextdb-server = { path = "../../../contextdb/crates/contextdb-server", features = ["iroh"], optional = true }
fs4.workspace = true
pollster.workspace = true
rayon.workspace = true
safetensors = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
strum.workspace = true
toml.workspace = true
tokenizers = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
uuid = { workspace = true, features = ["serde", "v4", "v7"] }

[dev-dependencies]
# Enable the fabric-sync worker seam for THIS crate's own integration tests (the frozen fabric
# tests call `fabric::run_worker_once`). This is a test/example/bench-only activation: it does NOT
# pull contextdb-server/tokio into the default `--edges normal,build` tree the purity guards check.
context-graph = { path = ".", features = ["fabric-sync", "test-support"] }
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
cg-catalog = { path = "../cg-catalog", features = ["embeddinggemma-test-support"] }
cg-connector-claude-code.workspace = true
contextdb-server = { path = "../../../contextdb/crates/contextdb-server", features = ["iroh", "test-seams"] }
contextdb-engine = { workspace = true, features = ["test-seams"] }
contextdb-tx.workspace = true
contextdb-vector = { workspace = true, features = ["test-seams"] }
criterion.workspace = true
iroh = { version = "1.0.2", default-features = false, features = ["tls-ring"] }
iroh-tickets = "1.0.0"
safetensors.workspace = true
sha2.workspace = true
serde_yaml_ng.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokenizers.workspace = true
trybuild.workspace = true

[[bench]]
name = "cg_crud"
harness = false
path = "../../benches/cg_crud.rs"

[[bench]]
name = "cg_graph"
harness = false
path = "../../benches/cg_graph.rs"

[[bench]]
name = "cg_impact_analysis"
harness = false
path = "../../benches/cg_impact_analysis.rs"

[[bench]]
name = "cg_embedding_spaces"
harness = false
path = "benches/cg_embedding_spaces.rs"

[[bench]]
name = "cg_event_history"
harness = false
path = "benches/cg_event_history.rs"
