[package]
name = "cg-local-llm"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "In-process, CPU-only, grammar-constrained local understanding engine (llama.cpp GGUF)"
edition = "2024"

[dependencies]
# CPU-only by default: default features (which include `openmp`/android stdcxx) are disabled; only
# `common` is enabled, which is what carries `json_schema_to_grammar` (schema -> GBNF) and the
# grammar sampler accept path. The optional `cuda` feature (below) adds the GPU backend for the
# CUDA artifact only; the CPU artifact never enables it.
llama-cpp-2 = { version = "0.1.150", default-features = false, features = ["common"] }
encoding_rs = "0.8.35"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[features]
default = []
# The CUDA artifact build enables this. It turns on llama-cpp-2's `cuda-no-vmm` chain, which links
# CUDA runtime/cuBLAS statically and opens the host driver (`libcuda.so.1`) lazily at runtime, so a
# GPU-less machine still reaches `main` and reports an honest CPU fallback rather than failing at
# process load. Plain `cuda` is deliberately NOT used: it can introduce a process-load
# `libcuda.so.1` NEEDED entry that breaks the fallback contract.
cuda = ["llama-cpp-2/cuda-no-vmm"]

[dev-dependencies]
tempfile = { workspace = true }
