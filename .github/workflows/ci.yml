    timeout-minutes: 120
    env:
      GATE_PHYSICAL_BUNDLE: ${{ matrix.bundle }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is intentionally excluded: descriptor-relative sync IO requires Unix.
