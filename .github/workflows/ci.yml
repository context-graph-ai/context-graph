          exit 1
        fi
    - name: Check out Context Graph
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: workspace/context-graph
        ref: ${{ github.event.pull_request.head.sha || inputs.cg_sha || github.sha }}
