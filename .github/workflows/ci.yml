name: ci

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      contextdb_sha:
        description: Exact 40-character ContextDB commit SHA
        required: true
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: workspace/context-graph

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      # `cg_catalog::default_cache_root()` resolves this exact root on every
      # platform. The fetch seed and local-only model proofs use it unchanged.
      CG_MODEL_CACHE_ROOT: ${{ runner.temp }}/cg-model-cache
    strategy:
      matrix:
        # windows-latest is intentionally excluded: the ContextDB substrate's
        # durable large-request sync staging is Unix-only by design (it
        # requires descriptor-relative filesystem operations), enforced via a
        # deliberate compile_error! under #[cfg(not(unix))] in
        # contextdb-server. ContextDB's own CI matrix has no Windows leg, so
        # Context Graph cannot build the sync test surface on Windows either.
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Validate exact ContextDB SHA
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          CONTEXTDB_SHA: ${{ inputs.contextdb_sha }}
        run: |
          if [[ ! "$CONTEXTDB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "contextdb_sha must be an exact 40-character lowercase hexadecimal commit SHA" >&2
            exit 1
          fi
      - name: Check out Context Graph
        uses: actions/checkout@v4
        with:
          path: workspace/context-graph
          fetch-depth: 0
          persist-credentials: false
      - name: Check out ContextDB
        uses: actions/checkout@v4
        with:
          repository: context-graph-ai/contextdb
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.contextdb_sha || 'dev' }}
          path: workspace/contextdb
          persist-credentials: false
      - name: Print and verify checked revisions
        env:
          REQUESTED_CONTEXTDB_SHA: ${{ inputs.contextdb_sha }}
        run: |
          context_graph_sha="$(git rev-parse HEAD)"
          contextdb_sha="$(git -C ../contextdb rev-parse HEAD)"
          if [[ ! "$context_graph_sha" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$contextdb_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "checkouts must resolve to immutable 40-character commit SHAs" >&2
            exit 1
          fi
          if [[ "$context_graph_sha" != "$GITHUB_SHA" ]]; then
            echo "checked-out Context Graph SHA does not match GITHUB_SHA" >&2
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ "$contextdb_sha" != "$REQUESTED_CONTEXTDB_SHA" ]]; then
            echo "checked-out ContextDB SHA does not match contextdb_sha" >&2
            exit 1
          fi
          printf 'Context Graph SHA: %s\n' "$context_graph_sha"
          printf 'ContextDB SHA: %s\n' "$contextdb_sha"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          workspaces: workspace/context-graph -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-expand@1.0.124,cargo-nextest@0.9.140
      - run: |
          require_file_without_match() {
            local pattern="$1"
            local file="$2"
            local grep_status=0
            grep -q -E "$pattern" "$file" || grep_status=$?
            case "$grep_status" in
              0)
                echo "forbidden dependency marker found in $file" >&2
                return 1
                ;;
              1) return 0 ;;
              *)
                echo "dependency-marker scan failed for $file" >&2
                return "$grep_status"
                ;;
            esac
          }
          cargo deny --config deny.toml check
          cargo expand --lib -p context-graph | tee "$RUNNER_TEMP/context-graph-expanded.rs"
          test -s "$RUNNER_TEMP/context-graph-expanded.rs"
          require_file_without_match 'embeddinggemma|candle_embeddinggemma' "$RUNNER_TEMP/context-graph-expanded.rs"
          cargo tree -p context-graph -e normal,build | tee "$RUNNER_TEMP/context-graph-tree.txt"
          test -s "$RUNNER_TEMP/context-graph-tree.txt"
          require_file_without_match '(^|[[:space:]])candle-embeddinggemma([[:space:]]|$)' "$RUNNER_TEMP/context-graph-tree.txt"
      - uses: actions/cache@v4
        id: nomic-model-cache
        with:
          # This is the root `cg_catalog::default_cache_root()` uses when the
          # environment override is set, so the seed and offline proofs share
          # the exact production model location.
          path: ${{ env.CG_MODEL_CACHE_ROOT }}
          key: cg-nomic-${{ runner.os }}-${{ hashFiles('workspace/context-graph/crates/context-graph/src/embedder/nomic.rs') }}
      - name: Seed Nomic model cache on cold miss
        if: steps.nomic-model-cache.outputs.cache-hit != 'true'
        run: |
          rustup run stable cargo run -p context-graph-cli --bin cg -- model fetch --defaults
          rustup run stable cargo test -p context-graph --test nomic_document_preparer_adds_exactly_one_system_task_prefix
      - name: Run offline real Nomic model proofs
        run: |
          rustup run stable cargo test -p context-graph \
            --test nomic_document_preparer_adds_exactly_one_system_task_prefix \
            --test nomic_query_preparer_adds_exactly_one_system_task_prefix \
            --test event_search_uses_role_preparation_while_digest_record_and_evidence_paths_remain_byte_for_byte_unchanged
      - name: Documented behavior claims name the test that enforces them, and that check still catches one that does not
        env:
          DOCUMENTATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${DOCUMENTATION_BASE_SHA:-HEAD^}"
          if [[ -z "$base" ]] || [[ "$base" =~ ^0+$ ]] || ! git rev-parse --verify --quiet "${base}^{commit}" > /dev/null; then
            base="HEAD^"
          fi
          git rev-parse --verify --quiet "${base}^{commit}" > /dev/null
          printf 'comparing the touched doc files against %s\n' "$base"
          python3 scripts/validate-doc-coverage.py --base "$base"
          bash scripts/check-doc-validator-negative-control.sh
      - run: rustup run stable cargo fmt --all --check
      - run: rustup run stable cargo clippy --workspace --all-targets -- -D warnings
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          docker image prune -a -f
          docker system prune -a -f --volumes
          rm -rf /opt/hostedtoolcache/CodeQL
          rm -rf /opt/hostedtoolcache/go
          rm -rf /opt/az
          rm -rf /opt/ghc
      - run: rustup run stable cargo test --workspace
      - name: Gate wall-clock baseline never rises without review
        env:
          DOCUMENTATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${DOCUMENTATION_BASE_SHA:-HEAD^}"
          if [[ -z "$base" ]] || [[ "$base" =~ ^0+$ ]] || ! git rev-parse --verify --quiet "${base}^{commit}" > /dev/null; then
            base="HEAD^"
          fi
          git rev-parse --verify --quiet "${base}^{commit}" > /dev/null
          printf 'comparing the gate wall-clock baseline against %s\n' "$base"
          python3 scripts/check-gate-wall-clock.py --base "$base"
      - name: Measure this run's own test wall-clock
        # The wall-clock arm compares seconds someone else already measured, so this run has to
        # produce a measurement of its own. `cargo test` writes no JUnit; nextest does, under the
        # `gate` profile checked in at .config/nextest.toml — the same profile scripts/gate.sh
        # uses. Without this step the arm has nothing to read, which is a comparison against an
        # empty measurement rather than a check.
        run: rustup run stable cargo nextest run --workspace --no-fail-fast --profile gate
      - name: Gate wall-clock stays inside the frozen baseline
        env:
          CG_GATE_JUNIT: ${{ github.workspace }}/workspace/context-graph/target/nextest/gate/junit.xml
        run: rustup run stable cargo test -p context-graph --test test_estate_audit gate_wall_seconds_never_exceed_the_frozen_baseline -- --ignored --exact
