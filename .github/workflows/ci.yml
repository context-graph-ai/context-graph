          if evidence_errors and os.environ['RECEIPT_JOB_STATUS'] == 'success':
              raise SystemExit('; '.join(evidence_errors))
          PY_RECEIPT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pr-${{ github.job }}-${{ runner.os }}
