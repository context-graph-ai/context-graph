name: ci

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cg/embedders
          key: cg-embedders-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --workspace
