        with:
          name: pr-complete-inventory
          path: ${{ runner.temp }}/shard-receipts/*.xml
          if-no-files-found: error
          retention-days: 14
  development-binaries:
    needs: [required]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.repository == 'context-graph-ai/context-graph'
    uses: ./.github/workflows/build.yml
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
