      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        env:
          CG_MODEL_CACHE_ROOT: ${{ runner.temp }}/cg-model-cache
        id: nomic-model-cache
        with:
          path: ${{ env.CG_MODEL_CACHE_ROOT }}
          key: cg-nomic-${{ runner.os }}-${{ hashFiles('workspace/context-graph/crates/context-graph/src/embedder/nomic.rs') }}
      - name: Seed Nomic model cache on cold miss
        env:
          CG_MODEL_CACHE_ROOT: ${{ runner.temp }}/cg-model-cache
        if: steps.nomic-model-cache.outputs.cache-hit != 'true'
        run: bash scripts/gate.sh model-seed
      - env:
          CG_MODEL_CACHE_ROOT: ${{ runner.temp }}/cg-model-cache
          MODEL_CACHE_HIT: 'true'
        run: bash scripts/gate.sh features
  extended-required:
    name: extended-required
    if: always()
    needs: [public-model, event-search]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the exact successful job inventory
        working-directory: .
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY_CHECK'
          import json, os
          expected = {'event-search', 'public-model'}
          needs = json.loads(os.environ['NEEDS_JSON'])
          if set(needs) != expected or any(row.get('result') != 'success' for row in needs.values()):
              raise SystemExit('required job inventory failed: ' + json.dumps(needs, sort_keys=True))
          print('all required jobs succeeded')
          PY_CHECK
  trusted-inputs:
    if: github.event_name == 'workflow_dispatch' && inputs.trusted
    environment: trusted-integration
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REQUESTED_CONTEXTDB_SHA: ${{ inputs.contextdb_sha }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      APPROVED_SESSION_LIST: ${{ vars.APPROVED_SESSION_LIST }}
      APPROVED_GOLD_DIR: ${{ vars.APPROVED_GOLD_DIR }}
      VARIANT_LABEL: candidate
      CONFIGURED_MODEL_ID: ${{ vars.CONFIGURED_MODEL_ID }}
      QUALITY_INPUT_RECEIPT: ${{ vars.QUALITY_INPUT_RECEIPT }}
      QUALITY_ACCEPTANCE_RECEIPT: ${{ vars.QUALITY_ACCEPTANCE_RECEIPT }}
      CG_SMOKE_REAL_JSONL: ${{ vars.CG_SMOKE_REAL_JSONL }}
      CG_SMOKE_HUB_TICKET: ${{ secrets.CG_SMOKE_HUB_TICKET }}
      CG_SMOKE_TENANT: ${{ vars.CG_SMOKE_TENANT }}
      CG_SMOKE_SKIP_BUILD: '1'
      CONTEXTDB: ${{ vars.CONTEXTDB_SMOKE_BINARY }}
      CONTEXTDB_BUILD_RECEIPT: ${{ vars.CONTEXTDB_BUILD_RECEIPT }}
      CG_LLM_SMOKE_HOSTED_ENDPOINT: ${{ vars.CG_LLM_SMOKE_HOSTED_ENDPOINT }}
      CG_LLM_SMOKE_HOSTED_MODEL: ${{ vars.CG_LLM_SMOKE_HOSTED_MODEL }}
      CG_LLM_SMOKE_HOSTED_API_KEY_ENV: OPENROUTER_API_KEY
      CG_LLM_SMOKE_LOCAL_ENDPOINT: ${{ vars.CG_LLM_SMOKE_LOCAL_ENDPOINT }}
