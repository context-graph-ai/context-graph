          TESTED_SHA: ${{ inputs.cg_sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ inputs.cg_sha || github.sha }}
          EVENT_SHA: ${{ github.sha }}
