[bans]
deny = [
    { name = "candle-embeddinggemma", version = "*", wrappers = ["cg-catalog"] },
    { name = "pyo3", version = "*" },
    { name = "cpython", version = "*" },
    { name = "tch", version = "*" },
    { name = "ort", version = "*" },
    { name = "tensorflow", version = "*" },
    { name = "tflite", version = "*" },
    { name = "onnxruntime", version = "*" },
    { name = "libtorch", version = "*" },
    { name = "reqwest", version = "*" },
    { name = "openai", version = "*" },
    { name = "anthropic-sdk", version = "*" },
    { name = "anthropic", version = "*" },
    { name = "cohere", version = "*" },
    { name = "openssl-sys", version = "*" },
    { name = "mkl-sys", version = "*" },
    { name = "cuda", version = "*" },
    { name = "cudnn", version = "*" },
    { name = "tensorrt", version = "*" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[advisories]
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0141",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
