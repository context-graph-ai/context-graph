[bans]
deny = [
    { name = "candle-embeddinggemma", version = "*", wrappers = ["cg-catalog"] },
    { name = "pyo3", version = "*" },
    { name = "cpython", version = "*" },
    { name = "tch", version = "*" },
    { name = "ort", version = "*" },
    { name = "tensorflow", version = "*" },
    { name = "tflite", version = "*" },
    { name = "onnxruntime", version = "*" },
    { name = "libtorch", version = "*" },
    # reqwest is banned for cg's own code (the LLM path stays on the in-house
    # client), but the dial-by-key sync transport library (iroh, via
    # contextdb-server) uses it internally for relay/net plumbing — allowed
    # ONLY as iroh's dependency.
    { name = "reqwest", version = "*", wrappers = ["iroh", "iroh-relay"] },
    { name = "openai", version = "*" },
    { name = "anthropic-sdk", version = "*" },
    { name = "anthropic", version = "*" },
    { name = "cohere", version = "*" },
    { name = "openssl-sys", version = "*" },
    { name = "mkl-sys", version = "*" },
    { name = "cuda", version = "*" },
    { name = "cudnn", version = "*" },
    { name = "tensorrt", version = "*" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    # Public-domain-equivalent; entered the graph via the dial-by-key sync
    # transport's wasm-target deps (ws_stream_wasm family) — never compiled
    # for shipped targets.
    "Unlicense",
]

[advisories]
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0141",
    # atomic-polyfill (unmaintained): embedded-target-only, reachable solely
    # via the sync transport's relay wire codec (iroh-relay -> postcard ->
    # heapless 0.7); never compiled for shipped targets; upstream offers no
    # safe upgrade until postcard moves to heapless 0.8.
    "RUSTSEC-2023-0089",
    # proc-macro-error (unmaintained): build-time proc-macro helper reached solely
    # via the sync transport's blob plane (iroh-blobs -> bao-tree -> genawaiter ->
    # genawaiter-proc-macro); compiled only on the host at build time, never linked
    # into a shipped artifact; no upgrade path until bao-tree/genawaiter drop it.
    "RUSTSEC-2024-0370",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# ContextDB is the first-party event-custody input pinned in the
# workspace manifest. All other git sources remain denied.
allow-git = ["https://github.com/context-graph-ai/contextdb"]
