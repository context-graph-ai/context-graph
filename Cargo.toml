[workspace]
resolver = "2"
members = ["cg-core", "cg-schema", "crates/context-graph"]

[workspace.package]
version = "0.1.0"
authors = ["OpenAI Codex <noreply@openai.com>"]
license = "Apache-2.0"
repository = "https://github.com/context-graph-ai/context-graph"
description = "Workspace for the context-graph rewrite"

[workspace.dependencies]
uuid = { version = "1.23.0", features = ["v4", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.44", features = ["serde"] }
contextdb-core = "0.3.3"
contextdb-engine = "0.3.3"
contextdb-graph = "0.3.3"
contextdb-relational = "0.3.3"
contextdb-tx = "0.3.3"
contextdb-vector = "0.3.3"
parking_lot = "0.12.5"
