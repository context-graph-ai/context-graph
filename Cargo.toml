[workspace]
resolver = "2"
members = [
    "crates/context-graph",
    "crates/cg-node-fs",
    "crates/candle-embeddinggemma",
    "crates/cg-catalog",
    "crates/cg-cli-conventions",
    "crates/cg-cli",
    "crates/cg-vision-embedder",
    "crates/cg-bench",
    "crates/cg-connector-claude-code",
]

[workspace.package]
version = "0.1.0"
authors = ["John Cyriac <lucidprogrammer@hotmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/context-graph-ai/context-graph"
description = "Agentic memory graph — Intention-centric ontology, contextdb-backed"

# CI's dev/test builds link a single huge dependency graph (contextdb-engine,
# iroh, candle, tokenizers) into each test/bench binary; full debug info on
# every crate in that graph (the cargo default) has been observed to exhaust
# ubuntu-latest GitHub Actions runner disk mid-link, crashing the linker with
# SIGBUS ("ld terminated with signal 7"). line-tables-only keeps file:line
# backtraces while dropping the bulky per-generic-instantiation type debug
# info that dominates the size of this workspace's debug builds.
[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
candle-embeddinggemma = { path = "crates/candle-embeddinggemma" }
cg-node-fs = { path = "crates/cg-node-fs" }
cg-cli-conventions = { path = "crates/cg-cli-conventions" }
cg-connector-claude-code = { path = "crates/cg-connector-claude-code" }
base64 = "0.22.1"
uuid = { version = "1.23.0", features = ["v4", "v7", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = { version = "0.28.0", features = ["derive"] }
chrono = { version = "0.4.44", features = ["serde"] }
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
criterion = { version = "0.8", features = ["html_reports"] }
contextdb-core = { path = "../contextdb/crates/contextdb-core" }
contextdb-engine = { path = "../contextdb/crates/contextdb-engine" }
contextdb-parser = { path = "../contextdb/crates/contextdb-parser" }
contextdb-tx = { path = "../contextdb/crates/contextdb-tx" }
contextdb-vector = { path = "../contextdb/crates/contextdb-vector" }
safetensors = "0.7.0"
sha2 = { version = "0.10.9", features = ["compress"] }
tempfile = "3.23.0"
tokenizers = "0.23.1"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["json"] }
trybuild = "1.0.112"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
fs4 = "0.13.1"
indicatif = "0.18.3"
toml = "0.9.8"
serde_yaml_ng = "0.10.0"
tiny_http = "0.12.0"
which = "8.0.0"
pollster = "0.4.0"
rayon = "1.12.0"
