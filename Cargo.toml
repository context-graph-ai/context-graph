[workspace]
resolver = "2"
members = [
    "crates/context-graph",
    "crates/cg-node-fs",
    "crates/candle-embeddinggemma",
    "crates/cg-catalog",
    "crates/cg-cli-conventions",
    "crates/cg-cli",
    "crates/cg-vision-embedder",
    "crates/cg-bench",
    "crates/cg-connector-claude-code",
]

exclude = ["vendor/candle-core", "vendor/candle-nn", "vendor/candle-transformers"]

[workspace.package]
keywords = ["agent-memory", "knowledge-graph", "embeddings", "claude-code", "local-first"]
categories = ["database", "command-line-utilities"]
version = "0.1.0"
authors = ["John Cyriac <lucidprogrammer@hotmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/context-graph-ai/context-graph"
description = "Agentic memory graph — Intention-centric ontology, contextdb-backed"

# Dev/test builds link contextdb-engine, iroh, candle and tokenizers into each
# test/bench binary. line-tables-only keeps file:line backtraces while limiting
# per-generic-instantiation debug info to fit CI runner disk capacity.
[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
candle-embeddinggemma = { path = "crates/candle-embeddinggemma" }
cg-node-fs = { path = "crates/cg-node-fs" }
cg-cli-conventions = { path = "crates/cg-cli-conventions" }
cg-connector-claude-code = { path = "crates/cg-connector-claude-code" }
base64 = "0.22.1"
uuid = { version = "1.23.0", features = ["v4", "v7", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = { version = "0.28.0", features = ["derive"] }
chrono = { version = "0.4.44", features = ["serde"] }
candle-core = { path = "vendor/candle-core", version = "=0.10.2" }
candle-nn = { path = "vendor/candle-nn", version = "=0.10.2" }
candle-transformers = { path = "vendor/candle-transformers", version = "=0.10.2" }
criterion = { version = "0.8", features = ["html_reports"] }
contextdb-core = { git = "https://github.com/context-graph-ai/contextdb", rev = "50afbaba8410585bd58e7ab7a02fe70273a136d3" }
contextdb-engine = { git = "https://github.com/context-graph-ai/contextdb", rev = "50afbaba8410585bd58e7ab7a02fe70273a136d3" }
contextdb-parser = { git = "https://github.com/context-graph-ai/contextdb", rev = "50afbaba8410585bd58e7ab7a02fe70273a136d3" }
contextdb-tx = { git = "https://github.com/context-graph-ai/contextdb", rev = "50afbaba8410585bd58e7ab7a02fe70273a136d3" }
contextdb-vector = { git = "https://github.com/context-graph-ai/contextdb", rev = "50afbaba8410585bd58e7ab7a02fe70273a136d3" }
safetensors = "0.7.0"
sha2 = "0.10.9"
tempfile = "3.23.0"
tokenizers = "0.23.1"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["json"] }
trybuild = "1.0.112"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
fs4 = "0.13.1"
indicatif = "0.18.3"
toml = "0.9.8"
serde_yaml_ng = "0.10.0"
tiny_http = "0.12.0"
which = "8.0.0"
pollster = "0.4.0"
rayon = "1.12.0"
